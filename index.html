<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Verification | EBL Self Service</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f0f0f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: #222;
    }

    /* ── Top bar ─────────────────────────────────── */
    .topbar {
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .topbar-left img {
        height: 48px;       /* adjust once real logo is placed */
        width: auto;
        display: block;
    }
    .topbar-right img {
        height: 57px;       /* adjust once real logo is placed */
        width: auto;
        display: block;
    }

    /* ── Gold accent line ────────────────────────── */
    .gold-line { height: 4px; background: #F5C518; }

    /* ── Page body ───────────────────────────────── */
    .page-body {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 48px 16px 60px;
    }
    .verify-wrap { width: 100%; max-width: 560px; }

    /* ── Main card ───────────────────────────────── */
    .main-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0,0,0,.08);
        overflow: hidden;
        padding: 40px 40px 36px;
    }

    /* ── Section heading ─────────────────────────── */
    .card-title { font-size: 1.5rem; font-weight: 700; color: #111; margin-bottom: 8px; }
    .card-sub   { font-size: .88rem; color: #666; margin-bottom: 28px; line-height: 1.5; }

    /* ── Input ───────────────────────────────────── */
    .field-wrap { position: relative; margin-bottom: 20px; }
    .field-wrap label {
        position: absolute; top: 13px; left: 16px;
        font-size: .8rem; color: #999;
        pointer-events: none; transition: all .15s;
    }
    .field-wrap input {
        width: 100%; border: 1.5px solid #ddd; border-radius: 8px;
        padding: 22px 16px 8px; font-size: .95rem; color: #222;
        outline: none; transition: border-color .2s; background: #fafafa;
    }
    .field-wrap input:focus { border-color: #003876; background: #fff; }
    .field-wrap input:focus + label,
    .field-wrap input:not(:placeholder-shown) + label {
        top: 6px; font-size: .7rem; color: #888;
    }

    /* ── Buttons ─────────────────────────────────── */
    .btn-row { display: flex; gap: 12px; margin-top: 8px; }
    .btn-back {
        flex: 1; padding: 14px; border: none; border-radius: 8px;
        background: #e0e0e0; color: #444; font-size: .95rem; font-weight: 600;
        cursor: pointer; text-decoration: none; text-align: center; display: inline-block;
    }
    .btn-back:hover { background: #d0d0d0; }
    .btn-primary {
        flex: 2; padding: 14px; border: none; border-radius: 8px;
        background: #F5C518; color: #111; font-size: .95rem; font-weight: 700;
        cursor: pointer; transition: background .15s;
    }
    .btn-primary:hover { background: #e6b800; }

    /* ── Status result ───────────────────────────── */
    .status-wrap { text-align: center; padding: 8px 0 24px; }
    .status-circle {
        width: 80px; height: 80px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 18px; font-size: 2rem;
    }
    .status-circle.ok  { background: #e6f9ef; color: #1a8a4a; }
    .status-circle.bad { background: #fdecea; color: #c0392b; }
    .status-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; }
    .status-title.ok  { color: #1a8a4a; }
    .status-title.bad { color: #c0392b; }
    .status-sub { font-size: .84rem; color: #888; margin-bottom: 28px; }

    /* ── Detail rows ─────────────────────────────── */
    .divider { border: none; border-top: 1px solid #eee; margin: 0 -40px; }
    .detail-row { display: flex; align-items: center; padding: 13px 0; border-bottom: 1px solid #f2f2f2; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { flex: 0 0 44%; font-size: .78rem; color: #999; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .detail-value { flex: 1; font-size: .9rem; color: #222; font-weight: 500; }

    /* ── Error ───────────────────────────────────── */
    .err-msg { background: #fdecea; color: #c0392b; border-radius: 8px; padding: 12px 16px; font-size: .85rem; margin-bottom: 20px; }

    /* ── Footer links ────────────────────────────── */
    .verify-links { text-align: center; margin-top: 20px; font-size: .82rem; color: #999; }
    .verify-links a { color: #003876; font-weight: 600; text-decoration: none; }
    .verify-links a:hover { text-decoration: underline; }
    .verify-links .sep { margin: 0 10px; color: #ddd; }

    /* ==================== LOCAL CAPTCHA STYLE START ==================== */
    .captcha-section { text-align: center; }
    .captcha-image-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 18px;
    }
    .captcha-image {
        width: 190px;
        height: 60px;
        border: 1px solid #ddd;
        border-radius: 8px;
        object-fit: cover;
        background: #f8f8f8;
    }
    .captcha-refresh {
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 8px;
        background: #003876;
        color: #fff;
        font-size: 1.35rem;
        line-height: 1;
        cursor: pointer;
    }
    .captcha-refresh:hover { background: #002957; }
    .captcha-input {
        width: 100%;
        border: 1.5px solid #ddd;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 16px;
        font-size: 1rem;
        text-align: center;
        letter-spacing: 4px;
        text-transform: uppercase;
        outline: none;
        background: #fafafa;
    }
    .captcha-input:focus { border-color: #003876; background: #fff; }
    /* ===================== LOCAL CAPTCHA STYLE END ===================== */

    /* ── Footer bar ──────────────────────────────── */
    .site-footer {
        background: #F5C518;
        color: #003876;
        text-align: center;
        font-size: .78rem;
        font-weight: 600;
        padding: 14px;
        letter-spacing: .3px;
    }
</style>
